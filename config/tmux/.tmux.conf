set-option -g default-terminal "xterm-256color"
set-window-option -g xterm-keys on

set -as terminal-features ",*:RGB"
set -as terminal-features ",*:hyperlinks"
# Tell tmux to support True Color (Tc) -- needed for older tmux versions
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*:UTF-8"

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key C-a last-window

# Renumber windows when one gets closed
set -g renumber-windows on

# Passes focus event through tmux
set -g focus-events on

set -g set-clipboard on
set -g mouse on
set -g base-index 1
set-option -g repeat-time 0

set-window-option -g mode-keys vi

#clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
unbind -T copy-mode-vi MouseDragEnd1Pane

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# vim-like pane resizing
bind -r C-k resize-pane -U 15
bind -r C-j resize-pane -D 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

# swap windows
bind-key -n S-Left swap-window -t -1
bind-key -n S-Right swap-window -t +1

# Reload
bind r source-file ~/.tmux.conf

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Kanagawa Dragon Palette Variables
# Background: #181616 (dragonBlack3)
# Foreground: #c5c9c5 (dragonWhite)

set -g status-position top

# Pane borders
set -g pane-border-style "fg=#625e5a"           # dragonBlack6
set -g pane-active-border-style "fg=#8ea4a2"    # dragonAqua

# Status bar general layout
set -g status-style "fg=#c5c9c5 bg=#181616"     # dragonWhite on dragonBlack3

# Right status
set -g status-right ""
set -g status-right-length 0
set -g status-left-length 30

# Active window tab
setw -g window-status-current-style "fg=#181616 bg=#a292a3 bold" # dragonBlack3 on dragonPink
setw -g window-status-current-format " #I:#W#F "

# Inactive window tabs
setw -g window-status-style "fg=#c5c9c5 bg=#181616"
setw -g window-status-format "#[fg=#8ea4a2] #I #[fg=#c5c9c5]#W "

# Window bell alert
setw -g window-status-bell-style "fg=#c4746e bg=#181616 bold" # dragonRed


